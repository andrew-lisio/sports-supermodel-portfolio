name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Include commands, sanitized inputs, and traceback.
    validations:
      required: true
  - type: input
    attributes:
      label: Python version
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account information, and other private data.
          required: true
