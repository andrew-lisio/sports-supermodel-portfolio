name: tests

on:
  push:
    branches: [main, "v2.4-development", "v2.4-accelerated-integration"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src app.py tests
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          sports-supermodel --help
          sports-supermodel-registry
