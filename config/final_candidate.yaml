schema_version: 1
candidate:
  version: 2.4.0.rc2
  production_anchor: 2.3.3
  branch: v2.4-live-freshness-fix
  model_commit: 9ab48cd16d5581613d868d4a15bfc758b818675a
  rollback_commit: ceda10db74dbb8b083cb4150807300eec86bed83
  promotion_status: PENDING
execution:
  production_track: v2.3.3
  shadow_track: v2.4.0.rc2
  winner_models_required: 7
  monte_carlo_simulations_default: 100000
  record_exact_git_commit: true
  background_execution: false
advanced_context:
  immutable_point_in_time_snapshot: true
  fail_closed_on_missing_optional_sources: true
  official_mlb_inputs:
    - probable_starter_identity_and_public_season_stats
    - posted_lineup_public_season_aggregates
    - recent_reliever_workload
    - team_pitching_and_fielding_proxies
    - weather_roof_and_wind
    - recent_travel_and_time_zone_load
  provider_ready_but_not_fabricated:
    - Statcast_xERA_xFIP_SIERA_and_pitch_quality
    - projected_injury_WAR
    - FRV_OAA_and_catcher_framing
    - umpire_factors
adaptive_shadow_overlay:
  minimum_graded_games: 60
  chronological_validation_fraction: 0.25
  minimum_validation_games: 20
  maximum_home_logit_adjustment: 0.35
  activation_requires_brier_improvement: true
  maximum_log_loss_regression: 0.002
  inactive_behavior: preserve_base_v2_4_probability
promotion:
  retrospective_gates_file: config/merge_gates.yaml
  prospective_games_required: 500
  closing_line_tracking_required: true
  schedule_integrity_required: true
  target_leakage_tests_required: true
  point_in_time_provenance_required: true
  final_holdout_required: true

history_freshness:
  automatic_completed_game_refresh: true
  persistent_runtime_cache: runtime/data/mlb_completed_games.csv
  checked_through: prior_day
  fail_closed_on_api_error: true
  fail_closed_on_unresolved_prior_game: true
  same_day_results_excluded: true
selection_policy:
  preserve_raw_ensemble_prediction: true
  minimum_top_pick_probability: 0.53
  minimum_top_pick_overlap: 4
  reject_component_consensus_conflict: true
  reject_projected_score_conflict_at_runs: 0.20
  never_force_five_picks: true
