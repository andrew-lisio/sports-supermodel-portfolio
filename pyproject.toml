[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-supermodel"
version = "2.6.0.dev1+pa.generative.integration"
description = "MLB probabilistic forecasting platform with seven-model ensembles, immutable pregame data, and generative PA simulation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Andrew Lisio", email = "291412269+andrew-lisio@users.noreply.github.com"}
]
keywords = ["mlb", "machine-learning", "sports-analytics", "monte-carlo", "baseball"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.37",
]
storage = [
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
]
dev = [
  "pytest>=8.0",
  "ruff==0.16.1",
  "build>=1.2",
]

[project.scripts]
sports-supermodel = "supermodel.cli:main"
sports-supermodel-ui = "supermodel.web_app:launch"
sports-supermodel-validate = "supermodel.validation_cli:main"
sports-supermodel-optimize-form = "supermodel.recent_form_cli:launch"
sports-supermodel-optimize-opponent-form = "supermodel.opponent_form_cli:launch"
sports-supermodel-registry = "supermodel.model_registry_cli:main"
sports-supermodel-evidence = "supermodel.evidence_cli:main"
sports-supermodel-starters = "supermodel.starter_cli:main"
sports-supermodel-adaptive = "supermodel.adaptive_cli:main"
sports-supermodel-history = "supermodel.history_cli:main"
sports-supermodel-conflicts = "supermodel.conflict_audit_cli:main"
sports-supermodel-features = "supermodel.feature_authority_cli:main"
sports-supermodel-pitching = "supermodel.pitching_context_cli:main"
sports-supermodel-refresh = "supermodel.refresh_cli:main"
sports-supermodel-publish = "supermodel.publisher_cli:main"
sports-supermodel-odds = "supermodel.odds_cli:main"
sports-supermodel-worker = "supermodel.worker_cli:main"
sports-supermodel-storage = "supermodel.storage_cli:main"
sports-supermodel-live-context = "supermodel.live_context_cli:main"
sports-supermodel-totals = "supermodel.totals_cli:main"
sports-supermodel-api = "supermodel.api_server:main"
sports-supermodel-settle = "supermodel.settlement_cli:main"
sports-supermodel-candidate = "supermodel.candidate_cli:main"
sports-supermodel-ops = "supermodel.ops_cli:main"
sports-supermodel-public = "supermodel.public_readiness_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"supermodel.storage_migrations" = ["*.sql"]
"supermodel" = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["reports", "snapshots", "docs/history", "examples/historical_runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]
