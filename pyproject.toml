[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-supermodel"
version = "2.4.0.dev6"
description = "Experimental MLB prediction ensemble with user-entered odds, immutable pregame snapshots, and Monte Carlo score simulation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Sports SuperModel contributors"}
]
keywords = ["mlb", "machine-learning", "sports-analytics", "monte-carlo", "baseball"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.37",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "build>=1.2",
]

[project.scripts]
sports-supermodel = "supermodel.cli:main"
sports-supermodel-ui = "supermodel.web_app:launch"
sports-supermodel-validate = "supermodel.validation_cli:main"
sports-supermodel-optimize-form = "supermodel.recent_form_cli:launch"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["reports", "snapshots", "docs/history"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
